name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      # PYTHONDONTWRITEBYTECODE matters here: the process-boundary tests assert an
      # exact file inventory, and stray __pycache__ directories fail them.
      - run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -v
        env:
          PYTHONDONTWRITEBYTECODE: "1"

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .
      # The README claims verify and demo are offline and grant no authority.
      # Assert the demo's own effect flags rather than trusting the prose.
      - name: verify and demo report no authority
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -uo pipefail
          mothership verify > /dev/null || { echo "::error::mothership verify failed"; exit 1; }
          out="$(mothership demo)" || { echo "::error::mothership demo failed"; exit 1; }
          echo "$out"
          echo "$out" | python -c "import json,sys; d=json.load(sys.stdin); assert d['status']=='passed', d['status']; assert d['authority_effect'] is False, 'authority_effect must be false'; assert d['execution_effect'] is False, 'execution_effect must be false'; kinds=[s['kind'] for s in d['stages']]; assert kinds==['frontdoor-task','governance-handoff','router-manifest','observation-snapshot'], kinds; assert all(s['valid'] for s in d['stages']), 'every stage must be valid'; print('ok: four protocol stages composed with both effect flags false')"

  companion:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - name: Core suite with companion source
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: ".:packages/mothership-github"
        run: |
          python -c '
          import unittest

          import mothership_github

          loader = unittest.TestLoader()
          suite = loader.discover("tests")
          if suite.countTestCases() == 0:
              print("::error::Core suite discovered 0 tests")
              raise SystemExit(1)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.skipped:
              print(f"::error::Core suite skipped {len(result.skipped)} test(s)")
          if not result.wasSuccessful() or result.skipped:
              raise SystemExit(1)
          '
      - name: Companion suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: ".:packages/mothership-github"
        run: |
          python -c '
          import unittest

          import mothership_github

          loader = unittest.TestLoader()
          suite = loader.discover("packages/mothership-github/tests")
          if suite.countTestCases() == 0:
              print("::error::Companion suite discovered 0 tests")
              raise SystemExit(1)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.skipped:
              print(f"::error::Companion suite skipped {len(result.skipped)} test(s)")
          if not result.wasSuccessful() or result.skipped:
              raise SystemExit(1)
          '

  adapters-common:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]" -e packages/mothership-github -e packages/mothership-adapters
      - name: Common adapter suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: ".:packages/mothership-github:packages/mothership-adapters"
        run: |
          python -c '
          import unittest

          loader = unittest.TestLoader()
          suite = unittest.TestSuite()
          for pattern in (
              "test_cli.py",
              "test_evidence.py",
              "test_owner.py",
              "test_session.py",
          ):
              suite.addTests(loader.discover("packages/mothership-adapters/tests", pattern=pattern))
          if suite.countTestCases() == 0:
              print("::error::Common adapter suite discovered 0 tests")
              raise SystemExit(1)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.skipped:
              print(f"::error::Common adapter suite skipped {len(result.skipped)} test(s)")
          if not result.wasSuccessful() or result.skipped:
              raise SystemExit(1)
          '

  adapters-optional:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: agents
            extra: agents
            test_file: test_agents_sdk.py
          - name: langgraph
            extra: langgraph
            test_file: test_langgraph_adapter.py
          - name: mcp
            extra: mcp
            test_file: test_mcp_server.py
    name: adapters-optional (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]" -e packages/mothership-github -e "packages/mothership-adapters[${{ matrix.extra }}]"
      - name: Optional adapter suite
        env:
          ADAPTER_TEST_FILE: ${{ matrix.test_file }}
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: ".:packages/mothership-github:packages/mothership-adapters"
        run: |
          python -c '
          import os
          import unittest

          loader = unittest.TestLoader()
          suite = loader.discover(
              "packages/mothership-adapters/tests",
              pattern=os.environ["ADAPTER_TEST_FILE"],
          )
          if suite.countTestCases() == 0:
              print("::error::Optional adapter suite discovered 0 tests")
              raise SystemExit(1)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.skipped:
              print(f"::error::Optional adapter suite skipped {len(result.skipped)} test(s)")
          if not result.wasSuccessful() or result.skipped:
              raise SystemExit(1)
          '

  node-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]" -e packages/mothership-github -e packages/mothership-adapters
      - name: Fetch and build pinned Lobster runtime
        env:
          LOBSTER_COMMIT: 74db2679fe34c6b04b067eebea943eaabd8b789f
        run: |
          set -euo pipefail
          lobster="$RUNNER_TEMP/lobster"
          git init "$lobster"
          git -C "$lobster" remote add origin https://github.com/openclaw/lobster.git
          git -C "$lobster" fetch --depth=1 origin "$LOBSTER_COMMIT"
          git -C "$lobster" checkout --detach "$LOBSTER_COMMIT"
          test "$(git -C "$lobster" rev-parse HEAD)" = "$LOBSTER_COMMIT"
          cd "$lobster"
          corepack enable
          corepack pnpm install --frozen-lockfile
          corepack pnpm run build
          test -f "$lobster/dist/src/core/index.js"
      - name: Node host adapter suite
        env:
          LOBSTER_CORE_MODULE: ${{ runner.temp }}/lobster/dist/src/core/index.js
          PYTHON_EXECUTABLE: python
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/packages/mothership-adapters:${{ github.workspace }}/packages/mothership-github
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/node-host-tests.txt"
          if ! node --test --test-reporter=tap \
            integrations/openclaw/owner-client.test.mjs \
            integrations/openclaw/adapter.test.mjs \
            integrations/lobster/adapter.test.mjs >"$report" 2>&1; then
            cat "$report"
            echo "::error::Node host adapter tests failed"
            exit 1
          fi
          cat "$report"
          tests="$(sed -nE 's/^# tests ([0-9]+)$/\1/p' "$report" | tail -n 1)"
          skipped="$(sed -nE 's/^# skipped ([0-9]+)$/\1/p' "$report" | tail -n 1)"
          failures="$(sed -nE 's/^# fail ([0-9]+)$/\1/p' "$report" | tail -n 1)"
          case "$tests" in
            ''|*[!0-9]*)
              echo "::error::Node host adapter test summary is missing"
              exit 1
              ;;
          esac
          if [ "$tests" -le 0 ]; then
            echo "::error::Node host adapter suite discovered 0 tests"
            exit 1
          fi
          if [ "$skipped" != "0" ]; then
            echo "::error::Node host adapter suite skipped ${skipped:-unknown} test(s)"
            exit 1
          fi
          if [ "$failures" != "0" ]; then
            echo "::error::Node host adapter suite reported ${failures:-unknown} failure(s)"
            exit 1
          fi

  harness-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch exact public Harness fixture
        env:
          HARNESS_REVISION: 9d88a091a56e9a5fb76c3c901a1da75b01c5c110
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/harness"
          git init "$fixture"
          git -C "$fixture" remote add origin https://github.com/UMEBOSHIISAN/ume-harness.git
          git -C "$fixture" fetch --depth=1 origin "$HARNESS_REVISION"
          git -C "$fixture" checkout --detach "$HARNESS_REVISION"
          test "$(git -C "$fixture" rev-parse HEAD)" = "$HARNESS_REVISION"
      - run: python -m pip install -e . -e packages/mothership-github -e packages/mothership-adapters
      - name: Qualify bridge and actual-worktree reference owner
        env:
          MOTHERSHIP_HARNESS_ROOT: ${{ runner.temp }}/harness
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python tools/qualify_harness_bridge.py --harness-root "$MOTHERSHIP_HARNESS_ROOT" \
            | tee harness-qualification.json
      - name: Record qualification revisions and counts
        if: always()
        run: |
          if test -f harness-qualification.json; then
            cat harness-qualification.json >> "$GITHUB_STEP_SUMMARY"
          fi
