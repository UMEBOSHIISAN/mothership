[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mothership-control-plane"
dynamic = ["version"]
description = "Bounded consequential-authority and evidence primitives for AI-assisted actions"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.optional-dependencies]
test = ["build>=1.2", "setuptools>=77"]

[project.scripts]
mothership = "mothership.cli:main"

[tool.setuptools.dynamic]
version = {file = ["VERSION"]}

[tool.setuptools.packages.find]
where = ["."]
include = ["mothership*", "orchestration*", "frontdoor*", "safety*", "evidence*"]

[tool.setuptools.package-data]
mothership = ["resources/*.json", "resources/**/*.json"]
evidence = ["contracts/*.json"]
frontdoor = ["contracts/*.json"]
orchestration = ["config/*.json", "contracts/*.json"]
safety = ["contracts/*.json"]
