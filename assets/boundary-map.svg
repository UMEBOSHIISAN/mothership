<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="What travels with the package versus what stays with the operator">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1024"/>
      <stop offset="100%" stop-color="#101c3d"/>
    </linearGradient>
    <linearGradient id="hullGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5fd3d3" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4a90d9" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1200" height="600" fill="url(#bgGrad)"/>

  <!-- starfield -->
  <g fill="#ffffff" opacity="0.55">
    <circle cx="70" cy="60" r="1.4"/><circle cx="210" cy="130" r="1"/><circle cx="330" cy="48" r="1.2"/>
    <circle cx="150" cy="300" r="1"/><circle cx="90" cy="470" r="1.3"/><circle cx="260" cy="530" r="1"/>
    <circle cx="960" cy="70" r="1.3"/><circle cx="1080" cy="180" r="1"/><circle cx="1140" cy="420" r="1.2"/>
    <circle cx="880" cy="520" r="1"/><circle cx="1020" cy="560" r="1.4"/><circle cx="620" cy="36" r="1"/>
  </g>

  <text x="600" y="52" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="27" font-weight="700" fill="#e8eef7">Share the structure. Keep the authority local.</text>
  <text x="600" y="82" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#8fa4c8">構造は配る。権限は渡さない。 — the one rule the whole control plane is built on</text>

  <!-- divider: the hull line -->
  <line x1="600" y1="118" x2="600" y2="560" stroke="url(#hullGrad)" stroke-width="3"/>
  <g filter="url(#soft)" opacity="0.5">
    <line x1="600" y1="118" x2="600" y2="560" stroke="#5fd3d3" stroke-width="4"/>
  </g>
  <circle cx="600" cy="118" r="6" fill="#5fd3d3"/>
  <circle cx="600" cy="560" r="6" fill="#4a90d9"/>

  <!-- LEFT: travels -->
  <text x="60" y="150" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#5fd3d3">TRAVELS WITH THE PACKAGE</text>
  <text x="60" y="174" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#7f93b8">パッケージと一緒に旅をするもの</text>

  <g font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
    <g transform="translate(60,200)">
      <rect width="480" height="52" rx="8" fill="#132449" stroke="#2c4a86"/>
      <text x="18" y="23" font-size="15" font-weight="600" fill="#e8eef7">Closed contracts &amp; JSON schemas</text>
      <text x="18" y="41" font-size="12" fill="#8fa4c8">task · decision · registry · invocation · assessment · approval-event</text>
    </g>
    <g transform="translate(60,262)">
      <rect width="480" height="52" rx="8" fill="#132449" stroke="#2c4a86"/>
      <text x="18" y="23" font-size="15" font-weight="600" fill="#e8eef7">Safety rules &amp; path guards</text>
      <text x="18" y="41" font-size="12" fill="#8fa4c8">fail-closed validation — malformed input stops, never degrades to allow</text>
    </g>
    <g transform="translate(60,324)">
      <rect width="480" height="52" rx="8" fill="#132449" stroke="#2c4a86"/>
      <text x="18" y="23" font-size="15" font-weight="600" fill="#e8eef7">Adapter aliases &amp; diagnostic shape</text>
      <text x="18" y="41" font-size="12" fill="#8fa4c8">claude-code-agent · codex-cli · ollama-local — names only, no commands</text>
    </g>
    <g transform="translate(60,386)">
      <rect width="480" height="52" rx="8" fill="#132449" stroke="#2c4a86"/>
      <text x="18" y="23" font-size="15" font-weight="600" fill="#e8eef7">Blank configuration templates</text>
      <text x="18" y="41" font-size="12" fill="#8fa4c8">executors.example.json ships with empty command arrays on purpose</text>
    </g>
    <g transform="translate(60,448)">
      <rect width="480" height="52" rx="8" fill="#132449" stroke="#2c4a86"/>
      <text x="18" y="23" font-size="15" font-weight="600" fill="#e8eef7">Tests, checksums, licenses</text>
      <text x="18" y="41" font-size="12" fill="#8fa4c8">221 stdlib tests — a rebuilt environment can prove itself before use</text>
    </g>
  </g>

  <!-- RIGHT: stays -->
  <text x="660" y="150" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#f0a04b">STAYS WITH THE OPERATOR</text>
  <text x="660" y="174" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#7f93b8">絶対に船に積まないもの</text>

  <g font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
    <g transform="translate(660,200)">
      <rect width="480" height="52" rx="8" fill="#2a1a12" stroke="#7d4a20"/>
      <text x="18" y="23" font-size="15" font-weight="600" fill="#ffd9b0">Credentials &amp; API keys</text>
      <text x="18" y="41" font-size="12" fill="#c69a72">never read, stored, transmitted, or generated by this package</text>
    </g>
    <g transform="translate(660,262)">
      <rect width="480" height="52" rx="8" fill="#2a1a12" stroke="#7d4a20"/>
      <text x="18" y="23" font-size="15" font-weight="600" fill="#ffd9b0">Personal paths, hosts, shell history</text>
      <text x="18" y="41" font-size="12" fill="#c69a72">no LAN address, no username, no machine topology — by contract</text>
    </g>
    <g transform="translate(660,324)">
      <rect width="480" height="52" rx="8" fill="#2a1a12" stroke="#7d4a20"/>
      <text x="18" y="23" font-size="15" font-weight="600" fill="#ffd9b0">Installed models &amp; execution choices</text>
      <text x="18" y="41" font-size="12" fill="#c69a72">an alias in a result is a name, not a launch</text>
    </g>
    <g transform="translate(660,386)">
      <rect width="480" height="52" rx="8" fill="#2a1a12" stroke="#7d4a20"/>
      <text x="18" y="23" font-size="15" font-weight="600" fill="#ffd9b0">Real command arrays &amp; endpoints</text>
      <text x="18" y="41" font-size="12" fill="#c69a72">you write them, you review them, they stay out of Git</text>
    </g>
    <g transform="translate(660,448)">
      <rect width="480" height="52" rx="8" fill="#2a1a12" stroke="#7d4a20"/>
      <text x="18" y="23" font-size="15" font-weight="600" fill="#ffd9b0">Approval, deployment, side effects</text>
      <text x="18" y="41" font-size="12" fill="#c69a72">every arrow in this system returns to a human</text>
    </g>
  </g>

  <text x="600" y="586" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#6b7fa3">authority_effect: false · execution_effect: false — on every result Mothership emits</text>
</svg>
