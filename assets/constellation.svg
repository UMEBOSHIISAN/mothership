<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title>The Mothership flagship constellation</title>
  <desc>Ten independently adoptable companion repositories orbit Mothership as proof products and focused primitives. The lines represent discovery and composition, not installation, execution, or authority.</desc>
  <defs>
    <radialGradient id="constellation-bg" cx="50%" cy="48%" r="70%"><stop stop-color="#143149"/><stop offset=".55" stop-color="#091827"/><stop offset="1" stop-color="#050b15"/></radialGradient>
    <radialGradient id="flagship" cx="50%" cy="45%" r="60%"><stop stop-color="#39c7c5"/><stop offset=".46" stop-color="#137b83"/><stop offset="1" stop-color="#0b3849"/></radialGradient>
    <filter id="constellation-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1280" height="720" rx="24" fill="url(#constellation-bg)"/>
  <g fill="#b9ffff" opacity=".38"><circle cx="70" cy="90" r="1"/><circle cx="1180" cy="105" r="1.4"/><circle cx="1110" cy="650" r="1"/><circle cx="170" cy="625" r="1.3"/><circle cx="590" cy="55" r="1"/><circle cx="940" cy="65" r="1"/></g>
  <text x="640" y="55" text-anchor="middle" fill="#effcfc" font-family="ui-sans-serif,system-ui,sans-serif" font-size="30" font-weight="780">One flagship. Ten independent proofs.</text>
  <text x="640" y="84" text-anchor="middle" fill="#8fb0b9" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">discovery + composition • never installation, execution, or authority</text>
  <ellipse cx="640" cy="385" rx="250" ry="170" fill="none" stroke="#3f7580" stroke-opacity=".4" stroke-width="2" stroke-dasharray="6 8"/>
  <ellipse cx="640" cy="385" rx="480" ry="270" fill="none" stroke="#315666" stroke-opacity=".35" stroke-width="2" stroke-dasharray="4 10"/>
  <g stroke="#4e8992" stroke-opacity=".38" stroke-width="2" stroke-dasharray="5 8">
    <path d="M640 385 640 215"/><path d="M640 385 400 330"/><path d="M640 385 880 330"/><path d="M640 385 640 555"/>
    <path d="M640 385 185 250"/><path d="M640 385 175 440"/><path d="M640 385 330 635"/><path d="M640 385 950 635"/><path d="M640 385 1105 440"/><path d="M640 385 1095 250"/>
  </g>
  <g font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="middle">
    <g transform="translate(640 385)" filter="url(#constellation-glow)"><circle r="90" fill="url(#flagship)" stroke="#7cf1ec" stroke-width="3"/><text y="-8" fill="#fff" font-size="24" font-weight="850">Mothership</text><text y="20" fill="#d9ffff" font-size="12">agent flight recorder</text><text y="39" fill="#a6e4e2" font-size="11">the only star destination</text></g>
    <g transform="translate(640 190)"><circle r="12" fill="#55d7d2"/><text y="-25" fill="#dffafa" font-size="15" font-weight="700">Mothership Router</text><text y="33" fill="#82acb4" font-size="11">digest-bound dry run</text></g>
    <g transform="translate(390 320)"><circle r="12" fill="#55d7d2"/><text x="-12" y="-25" fill="#dffafa" font-size="15" font-weight="700">Agent Frontdoor</text><text x="-12" y="33" fill="#82acb4" font-size="11">scope-drift preflight</text></g>
    <g transform="translate(890 320)"><circle r="12" fill="#55d7d2"/><text x="18" y="-25" fill="#dffafa" font-size="15" font-weight="700">Workflow Governance Model</text><text x="18" y="33" fill="#82acb4" font-size="11">typed evidence chain</text></g>
    <g transform="translate(640 580)"><circle r="12" fill="#55d7d2"/><text y="34" fill="#dffafa" font-size="15" font-weight="700">Secretary TUI</text><text y="54" fill="#82acb4" font-size="11">read-only observation</text></g>
    <g transform="translate(170 235)"><circle r="9" fill="#f0a04b"/><text y="-24" fill="#ffe5c5" font-size="13" font-weight="700">Agent Team Runtime</text><text y="30" fill="#bd9870" font-size="10.5">packet replay</text></g>
    <g transform="translate(160 430)"><circle r="9" fill="#f0a04b"/><text y="-24" fill="#ffe5c5" font-size="13" font-weight="700">Evidence Spine Core</text><text y="30" fill="#bd9870" font-size="10.5">append-only chain</text></g>
    <g transform="translate(315 620)"><circle r="9" fill="#f0a04b"/><text y="-24" fill="#ffe5c5" font-size="13" font-weight="700">Run Lineage Core</text><text y="30" fill="#bd9870" font-size="10.5">deterministic joins</text></g>
    <g transform="translate(965 620)"><circle r="9" fill="#f0a04b"/><text y="-24" fill="#ffe5c5" font-size="13" font-weight="700">Source Health Core</text><text y="30" fill="#bd9870" font-size="10.5">source-backed records</text></g>
    <g transform="translate(1120 430)"><circle r="9" fill="#f0a04b"/><text y="-24" fill="#ffe5c5" font-size="13" font-weight="700">Agent Decision Core</text><text y="30" fill="#bd9870" font-size="10.5">advisory gate</text></g>
    <g transform="translate(1110 235)"><circle r="9" fill="#f0a04b"/><text y="-24" fill="#ffe5c5" font-size="13" font-weight="700">Knowledge Lifecycle Kit</text><text y="30" fill="#bd9870" font-size="10.5">human lifecycle gate</text></g>
  </g>
  <g transform="translate(350 680)" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5"><circle r="6" fill="#55d7d2"/><text x="14" y="4" fill="#93b2b9">proof products</text><circle cx="245" r="6" fill="#f0a04b"/><text x="259" y="4" fill="#93b2b9">focused primitives</text><line x1="443" y1="0" x2="493" y2="0" stroke="#4e8992" stroke-width="2" stroke-dasharray="5 8"/><text x="506" y="4" fill="#93b2b9">discovery / composition only</text></g>
</svg>
