<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1120" role="img" aria-labelledby="title desc">
  <title id="title">Responsibility split for humans and AI sharing work</title>
  <desc id="desc">The current public releases have no automatic runtime bridge. The dashed connection is not implemented.</desc>
  <style>
    .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17332d; }
    .label { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17332d; }
    .state { font: 700 18px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #176b58; }
    .body { font: 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #314d47; }
    .small { font: 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #55706a; }
  </style>
  <rect width="1200" height="1120" fill="#f7faf9"/>
  <text class="title" x="600" y="58" text-anchor="middle">Responsibility split for humans and AI sharing work</text>

  <rect x="250" y="95" width="700" height="112" rx="22" fill="#fff0d7" stroke="#b66a17" stroke-width="4"/>
  <text class="label" x="600" y="139" text-anchor="middle">Human</text>
  <text class="body" x="600" y="178" text-anchor="middle">Holds the purpose and decides what to entrust</text>

  <path d="M600 207 V247" stroke="#2b67a7" stroke-width="5"/>
  <path d="M590 235 L600 250 L610 235" fill="#2b67a7"/>

  <rect x="190" y="250" width="820" height="235" rx="26" fill="#e1edf9" stroke="#2b67a7" stroke-width="5"/>
  <text class="state" x="225" y="287">CURRENT</text>
  <text class="label" x="600" y="323" text-anchor="middle">UME-HARNESS</text>
  <text class="body" x="600" y="370" text-anchor="middle">Organize ambiguous Japanese intent</text>
<text class="body" x="600" y="412" text-anchor="middle">Will do / confirm / will not do</text>
<text class="body" x="600" y="454" text-anchor="middle">Bound local work</text>

  <path d="M600 485 V615" stroke="#7356a8" stroke-width="5" stroke-dasharray="14 12"/>
  <path d="M590 600 L600 618 L610 600" fill="#7356a8"/>
  <rect x="225" y="515" width="750" height="78" rx="18" fill="#eee8fb" stroke="#7356a8" stroke-width="3" stroke-dasharray="12 10"/>
  <text class="state" x="600" y="546" text-anchor="middle">DIRECTION — reviewed runtime bridge / NOT_SHIPPED</text>
  <text class="small" x="600" y="577" text-anchor="middle">Candidate responsibility link for local results and evidence</text>

  <rect x="190" y="620" width="820" height="235" rx="26" fill="#d9efe8" stroke="#176b58" stroke-width="5"/>
  <text class="state" x="225" y="657">CURRENT</text>
  <text class="label" x="600" y="693" text-anchor="middle">Mothership</text>
  <text class="body" x="600" y="740" text-anchor="middle">Freeze one concrete external action</text>
<text class="body" x="600" y="782" text-anchor="middle">Check the human decision</text>
<text class="body" x="600" y="824" text-anchor="middle">Consume once in one ledger history</text>

  <path d="M600 855 V900" stroke="#176b58" stroke-width="5"/>
  <path d="M590 885 L600 903 L610 885" fill="#176b58"/>
  <rect x="100" y="905" width="470" height="92" rx="20" fill="#ffffff" stroke="#7356a8" stroke-width="4" stroke-dasharray="13 10"/>
  <rect x="630" y="905" width="470" height="92" rx="20" fill="#ffffff" stroke="#237e91" stroke-width="4" stroke-dasharray="13 10"/>
  <text class="body" x="335" y="960" text-anchor="middle">Separately configured executor</text>
  <text class="body" x="865" y="960" text-anchor="middle">Separate verification path</text>

  <text class="small" x="600" y="1040" text-anchor="middle">The current public releases have no automatic runtime bridge. The dashed connection is not implemented.</text>
  <text class="small" x="600" y="1080" text-anchor="middle">Solid = implemented now    Dashed = not connected    Outline = separately configured</text>
</svg>
