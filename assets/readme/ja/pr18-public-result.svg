  <text x="382" y="220" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif" font-size="30" font-weight="700">1ファイル・+5 / -0</text>
  <line x1="96" y1="264" x2="1184" y2="264" stroke="#e2e8f0" stroke-width="3"/>
  <text x="96" y="312" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif" font-size="25" font-weight="700">対象ブランチ</text>
  <text x="96" y="348" fill="#0f172a" font-family="SFMono-Regular,Consolas,monospace" font-size="23">e2e/mothership-merge-canary-base-20260902b</text>
  <text x="96" y="402" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif" font-size="25" font-weight="700">PR元コミット識別子</text>
  <text x="96" y="438" fill="#0f172a" font-family="SFMono-Regular,Consolas,monospace" font-size="23">0874166551f11d580168e8b4d0f354e742d39fe6</text>
  <text x="96" y="492" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif" font-size="25" font-weight="700">統合後コミット識別子</text>
  <text x="96" y="528" fill="#0f172a" font-family="SFMono-Regular,Consolas,monospace" font-size="23">1cfbbf646b8ac227c8c411f08a961c4396cc69ca</text>
  <rect x="96" y="548" width="1088" height="72" rx="12" fill="#f1f5f9"/>
  <text x="640" y="594" text-anchor="middle" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif" font-size="25">Mothership本体の公開本線は操作対象外</text>
