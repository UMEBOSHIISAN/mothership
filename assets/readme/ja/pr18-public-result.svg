<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">PR #18 公開確認結果</title>
  <desc id="desc">隔離用ブランチへPR #18を統合した公開結果。対象ブランチ、PR元コミット識別子、統合後コミット識別子、差分量、公開本線が対象外だったことを示す。</desc>
  <rect width="1280" height="720" fill="#f8fafc"/>
  <rect x="48" y="48" width="1184" height="624" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="96" y="124" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif" font-size="38" font-weight="700">PR #18 — 公開確認できる結果</text>
  <rect x="96" y="154" width="230" height="76" rx="38" fill="#166534"/>
  <text x="211" y="206" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif" font-size="34" font-weight="700">統合済み</text>
