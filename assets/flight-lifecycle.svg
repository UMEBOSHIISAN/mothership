<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">Mothership Flight lifecycle</title>
  <desc id="desc">Eight required evidence stages from Intent through Persistence proof, followed by an optional reusable asset.</desc>
  <defs>
    <linearGradient id="flight-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#10273a"/>
    </linearGradient>
    <filter id="flight-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="560" rx="24" fill="url(#flight-bg)"/>
  <g fill="#9de8e8" opacity=".35">
    <circle cx="70" cy="70" r="1.5"/><circle cx="1180" cy="90" r="1"/><circle cx="1060" cy="500" r="1.5"/>
    <circle cx="210" cy="485" r="1"/><circle cx="640" cy="46" r="1.2"/><circle cx="870" cy="82" r="1"/>
  </g>
  <text x="64" y="70" fill="#dffafa" font-family="ui-sans-serif,system-ui,sans-serif" font-size="30" font-weight="750">One run. Eight required links.</text>
  <text x="64" y="101" fill="#8fb3bd" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">explicitly supplied records • deterministic replay • no ambient capture</text>
  <path d="M88 275 H1168" stroke="#315b68" stroke-width="4" stroke-linecap="round"/>
  <g font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="middle">
    <g transform="translate(95 275)">
      <circle r="25" fill="#0d3540" stroke="#54d6d2" stroke-width="3" filter="url(#flight-glow)"/><text y="5" fill="#dffafa" font-size="14" font-weight="700">01</text>
      <text y="58" fill="#dffafa" font-size="15" font-weight="700">Intent</text><text y="79" fill="#7fa9b3" font-size="11">what was asked</text>
    </g>
    <g transform="translate(235 275)">
      <circle r="25" fill="#0d3540" stroke="#54d6d2" stroke-width="3"/><text y="5" fill="#dffafa" font-size="14" font-weight="700">02</text>
      <text y="-55" fill="#dffafa" font-size="15" font-weight="700">Scope</text><text y="-34" fill="#7fa9b3" font-size="11">what was bounded</text>
    </g>
    <g transform="translate(375 275)">
      <circle r="25" fill="#0d3540" stroke="#54d6d2" stroke-width="3"/><text y="5" fill="#dffafa" font-size="14" font-weight="700">03</text>
      <text y="58" fill="#dffafa" font-size="15" font-weight="700">Decision</text><text y="79" fill="#7fa9b3" font-size="11">what was selected</text>
    </g>
    <g transform="translate(515 275)">
      <circle r="25" fill="#0d3540" stroke="#54d6d2" stroke-width="3"/><text y="5" fill="#dffafa" font-size="14" font-weight="700">04</text>
      <text y="-55" fill="#dffafa" font-size="15" font-weight="700">Approval binding</text><text y="-34" fill="#7fa9b3" font-size="11">who approved which scope</text>
    </g>
    <g transform="translate(655 275)">
      <circle r="25" fill="#0d3540" stroke="#54d6d2" stroke-width="3"/><text y="5" fill="#dffafa" font-size="14" font-weight="700">05</text>
      <text y="58" fill="#dffafa" font-size="15" font-weight="700">Execution receipt</text><text y="79" fill="#7fa9b3" font-size="11">what says it ran</text>
    </g>
    <g transform="translate(795 275)">
      <circle r="25" fill="#0d3540" stroke="#54d6d2" stroke-width="3"/><text y="5" fill="#dffafa" font-size="14" font-weight="700">06</text>
      <text y="-55" fill="#dffafa" font-size="15" font-weight="700">Result evidence</text><text y="-34" fill="#7fa9b3" font-size="11">what was produced</text>
    </g>
    <g transform="translate(935 275)">
      <circle r="25" fill="#0d3540" stroke="#54d6d2" stroke-width="3"/><text y="5" fill="#dffafa" font-size="14" font-weight="700">07</text>
      <text y="58" fill="#dffafa" font-size="15" font-weight="700">Verification</text><text y="79" fill="#7fa9b3" font-size="11">what was checked</text>
    </g>
    <g transform="translate(1075 275)">
      <circle r="25" fill="#0d3540" stroke="#54d6d2" stroke-width="3" filter="url(#flight-glow)"/><text y="5" fill="#dffafa" font-size="14" font-weight="700">08</text>
      <text y="-55" fill="#dffafa" font-size="15" font-weight="700">Persistence proof</text><text y="-34" fill="#7fa9b3" font-size="11">what still exists</text>
    </g>
    <g transform="translate(1180 275)">
      <circle r="20" fill="#2c2116" stroke="#f0a04b" stroke-width="2" stroke-dasharray="4 4"/><text y="5" fill="#ffd9b0" font-size="12" font-weight="700">+</text>
      <text y="58" fill="#ffd9b0" font-size="13" font-weight="700">Reusable asset</text><text y="79" fill="#bd9569" font-size="11">optional</text>
    </g>
  </g>
  <g transform="translate(64 425)" font-family="ui-sans-serif,system-ui,sans-serif">
    <rect width="1152" height="78" rx="12" fill="#0a1826" stroke="#294a57"/>
    <circle cx="34" cy="39" r="9" fill="#54d6d2"/><text x="56" y="34" fill="#dffafa" font-size="14" font-weight="700">COMPLETE requires the full linked chain through persistence.</text>
    <text x="56" y="56" fill="#8fb3bd" font-size="12">Missing evidence is INCOMPLETE. Contradictory or substituted evidence is INVALID. Scope or action mismatch is DRIFTED.</text>
  </g>
</svg>
